<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="De Mirai a Skynet">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#04110D"/><stop offset="0.5" stop-color="#14070A"/><stop offset="1" stop-color="#2A0B12"/>
  </linearGradient>
  <radialGradient id="core"><stop offset="0" stop-color="#FFF3B0"/><stop offset="0.5" stop-color="#FFB703"/><stop offset="1" stop-color="#E63946" stop-opacity="0"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E63946" stop-opacity="0.55"/><stop offset="1" stop-color="#E63946" stop-opacity="0"/></linearGradient>
  <g id="robot">
  <rect x="-7" y="-30" width="6" height="30" fill="#2B2F36"><animateTransform attributeName="transform" type="rotate" values="-22 -2 -30;22 -2 -30;-22 -2 -30" dur="0.7s" repeatCount="indefinite"/></rect>
  <rect x="1" y="-30" width="6" height="30" fill="#2B2F36"><animateTransform attributeName="transform" type="rotate" values="22 -2 -30;-22 -2 -30;22 -2 -30" dur="0.7s" repeatCount="indefinite"/></rect>
  <rect x="-12" y="-58" width="24" height="30" rx="3" fill="#3A3F48" stroke="#8A93A3" stroke-width="0.8"/>
  <rect x="-16" y="-56" width="5" height="24" rx="2" fill="#2B2F36"><animateTransform attributeName="transform" type="rotate" values="18 -13 -54;-18 -13 -54;18 -13 -54" dur="0.7s" repeatCount="indefinite"/></rect>
  <rect x="11" y="-56" width="5" height="24" rx="2" fill="#2B2F36"><animateTransform attributeName="transform" type="rotate" values="-18 16 -54;18 16 -54;-18 16 -54" dur="0.7s" repeatCount="indefinite"/></rect>
  <rect x="-9" y="-80" width="18" height="20" rx="4" fill="#4A515C" stroke="#8A93A3" stroke-width="0.8"/>
  <rect x="-7" y="-74" width="14" height="4" rx="2" fill="#E63946"><animate attributeName="opacity" values="1;0.35;1" dur="0.9s" repeatCount="indefinite"/></rect>
</g>
</defs>
<rect width="1000" height="200" fill="url(#bg)"/>
<g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-40 190;1040 190" dur="9s" begin="0s" repeatCount="indefinite"/>
    <g transform="scale(0.6)"><use href="#robot" xlink:href="#robot"/></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-40 190;1040 190" dur="14s" begin="-6s" repeatCount="indefinite"/>
    <g transform="scale(0.6)"><use href="#robot" xlink:href="#robot"/></g>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="-40 190;1040 190" dur="19s" begin="-12s" repeatCount="indefinite"/>
    <g transform="scale(0.6)"><use href="#robot" xlink:href="#robot"/></g>
  </g>
</g>

<g fill="#C8F5E1">
  <circle cx="330" cy="30" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="18" r="0.9" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="120" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.15;0.8;0.15" dur="3.7s" begin="1.2s" repeatCount="indefinite"/></circle>
</g>
<!-- Escena de toma de control (ciclo de 20 s): tinte rojo, nueva unidad que aparece y cambio de texto -->
<rect width="1000" height="200" fill="#E63946" opacity="0">
  <animate attributeName="opacity" values="0;0;0.14;0.14;0" keyTimes="0;0.45;0.55;0.95;1" dur="20s" repeatCount="indefinite"/>
</rect>
<g transform="translate(900 190) scale(0.6)">
  <g>
    <animateTransform attributeName="transform" type="scale" values="0 0;0 0;1.25 1.25;1 1;1 1;0 0" keyTimes="0;0.55;0.62;0.66;0.95;1" dur="20s" repeatCount="indefinite"/>
    <use href="#robot" xlink:href="#robot"/>
  </g>
</g>
<text x="40" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="40" font-weight="700" fill="#F5F5F5">De Mirai a Skynet</text>
<text x="40" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#C8F5E1">Lo que ya es real, lo que no, y qué hacer antes de que sea tarde</text>
<g>
  <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
  <text x="40" y="126" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#E63946">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>▸ unidades autónomas bajo control central</text>
</g>
<g>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1" dur="20s" repeatCount="indefinite" calcMode="discrete"/>
  <text x="40" y="126" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#FFB703">▸ mando central perdido: nueva unidad activada</text>
</g>
<polygon points="800,96 760,200 840,200" fill="url(#beam)"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/></polygon>
<circle cx="800" cy="70" r="30" fill="none" stroke="#E63946" stroke-width="1.5"><animate attributeName="r" values="26;70" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="70" r="30" fill="none" stroke="#FFB703" stroke-width="1"><animate attributeName="r" values="26;70" dur="2.4s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="70" r="52" fill="url(#core)" opacity="0.35"><animate attributeName="r" values="36;56;36" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="800" cy="70" r="26" fill="#1F0508" stroke="#FFB703" stroke-width="2"/>
<circle cx="800" cy="70" r="10" fill="#E63946"><animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/></circle>
<text x="800" y="118" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFB703" letter-spacing="2">SKYNET</text>
<circle r="3" fill="#FFB703"><animateMotion dur="2.2s" repeatCount="indefinite" path="M800,70 L300,186"/></circle>
<circle r="3" fill="#FFB703"><animateMotion dur="2.8s" begin="0.9s" repeatCount="indefinite" path="M800,70 L600,186"/></circle>
<circle r="3" fill="#FFB703"><animateMotion dur="3.1s" begin="1.6s" repeatCount="indefinite" path="M800,70 L880,186"/></circle>
<rect x="0" y="194" width="1000" height="6" fill="#1F0508"/>
</svg>
